<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholar's Mate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+20&family=Shrikhand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="marquee">
    <h1>Leaderboard</h1>
  </header>

  <section class="screen" aria-label="Arcade screen">
    <h2>High Score</h2>
    <table class="leaderboard">
        <thead>
          <tr>
            <th scope="col">Rank</th>
            <th scope="col">Name</th>
            <th scope="col">Score</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>AAA</td>
            <td>10000</td>
          </tr>
          <tr>
            <td>2</td>
            <td>BBB</td>
            <td>9000</td>
          </tr>
          <tr>
            <td>3</td>
            <td>CCC</td>
            <td>8000</td>
          </tr>
          <tr>
            <td>4</td>
            <td>DDD</td>
            <td>7000</td>
          </tr>
          <tr>
            <td>5</td>
            <td>EEE</td>
            <td>6000</td>
          </tr>
          <tr>
            <td>6</td>
            <td>FFF</td>
            <td>5000</td>
          </tr>
          <tr>
            <td>7</td>
            <td>GGG</td>
            <td>4000</td>
          </tr>
          <tr>
            <td>8</td>
            <td>HHH</td>
            <td>3000</td>
          </tr>
          <tr>
            <td>9</td>
            <td>III</td>
            <td>2000</td>
          </tr>
          <tr>
            <td>10</td>
            <td>JJJ</td>
            <td>1000</td>
          </tr>
        </tbody>
    </table>
  </section>
</body>
</html>
